<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0d47a1"/>

  <!-- Main crystal (rotated square/diamond) -->
  <rect x="11" y="11" width="10" height="10"
        transform="rotate(45 16 16)"
        fill="url(#crystalGrad)"
        stroke="#0d47a1"
        stroke-width="1.5"/>

  <!-- Shine/highlight on crystal -->
  <rect x="12.5" y="12.5" width="4" height="4"
        transform="rotate(45 16 16)"
        fill="url(#shineGrad)"
        opacity="0.7"/>

  <!-- Inner facets for depth -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#0d47a1" stroke-width="0.5" opacity="0.3"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="#0d47a1" stroke-width="0.5" opacity="0.3"/>
</svg>
